name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # 品質ゲート（src の import）だけでは build/exports の drift を捕捉できないため、
      # 実際に publish される dist を pack→install→plain node import で検証する。
      - name: 配布物（dist）の consumer smoke
        run: |
          set -euo pipefail
          ROOT="$PWD"
          TARBALL="$(npm pack --silent)"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm pkg set type=module >/dev/null 2>&1
          npm install "$ROOT/$TARBALL" >/dev/null 2>&1
          node --input-type=module -e "
          import { WPPoster } from '@pitolick/wp-poster';
          import { readFrontmatter } from '@pitolick/wp-poster/draft';
          if (typeof WPPoster !== 'function') throw new Error('WPPoster missing');
          if (typeof readFrontmatter !== 'function') throw new Error('readFrontmatter missing');
          console.log('dist consumer smoke OK');
          "
          cd "$ROOT"; rm -f "$TARBALL"

  dependabot-auto-merge:
    needs: quality
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: メタデータ取得
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch / dev minor / GitHub Actions minor を自動マージ
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.dependency-type == 'direct:development') ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
