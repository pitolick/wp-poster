name: Release (GitHub Packages)

# タグ push（v*）で GitHub Packages（npm registry）へ publish する。
# 例: git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'

      - run: npm ci

      - name: バージョン整合チェック（package.json version == タグ）
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION  tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json の version ($PKG_VERSION) とタグ ($TAG_VERSION) が一致しません"
            exit 1
          fi

      - name: 品質ゲート
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
