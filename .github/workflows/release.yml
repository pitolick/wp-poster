name: Release (GitHub Packages)

# main への push で package.json の version を検知し、まだ publish していない
# （= 対応する v<version> タグが存在しない）場合のみ GitHub Packages へ publish する。
# publish 成功後に v<version> タグを自動作成・push してリリース履歴を残す。
# → 手動でのタグ push は不要。version bump は通常の PR 差分として行う。

on:
  push:
    branches: [main]

permissions:
  contents: write # タグ作成・push 用
  packages: write # GitHub Packages publish 用

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      # persist-credentials: false で認証情報をランナーに残さない（artipacked 対策）。
      # fetch-depth: 0 でタグをローカル取得し、既存判定は git tag（ネットワーク不要）で行う。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # 特権ジョブ（packages: write）ではキャッシュポイズニング回避のため npm キャッシュを使わない。
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: publish 要否判定（version 変化＝タグ未存在か）
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git tag -l "v${VERSION}")" ]; then
            echo "v${VERSION} は既に publish 済み（タグ存在）。skip します。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} は未 publish。publish に進みます。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存インストール
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: 品質ゲート
        if: steps.check.outputs.skip != 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: タグ作成・push（publish 成功後）
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
