name: Release (GitHub Packages)

# main への push で package.json の version を検知し、まだ publish していない
# （= 対応する v<version> タグが存在しない）場合のみ GitHub Packages へ publish する。
# publish 成功後に v<version> タグを自動作成・push してリリース履歴を残す。
# → 手動でのタグ push は不要。version bump は通常の PR 差分として行う。

on:
  push:
    branches: [main]

permissions:
  contents: write # タグ作成・push 用
  packages: write # GitHub Packages publish 用

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'

      - name: publish 要否判定（version 変化＝タグ未存在か）
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} は既に publish 済み（タグ存在）。skip します。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} は未 publish。publish に進みます。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存インストール
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: 品質ゲート
        if: steps.check.outputs.skip != 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: タグ作成・push（publish 成功後）
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
