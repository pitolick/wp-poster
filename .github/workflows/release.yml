name: Release (GitHub Packages)

# main への push で package.json の version を検知し、まだ registry に publish
# されていない version の場合のみ GitHub Packages へ publish する。
# 冪等判定は「registry 上に当該 version が存在するか」で行う（ローカルタグ有無に
# 依存しない）。これにより publish 成功後にタグ付けが失敗しても、次回以降の push が
# 同一 version を再 publish して 409 で詰まることを防ぐ。
# publish 成功後の v<version> タグ付けは best-effort（失敗してもジョブは落とさない）。
# → 手動でのタグ push は不要。version bump は通常の PR 差分として行う。

on:
  push:
    branches: [main]

permissions:
  contents: write # タグ作成・push 用
  packages: write # GitHub Packages publish 用

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      # persist-credentials: false で認証情報をランナーに残さない（artipacked 対策）。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 特権ジョブ（packages: write）ではキャッシュポイズニング回避のため npm キャッシュを使わない。
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: publish 要否判定（registry に当該 version が存在するか）
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISHED="$(npm view "@pitolick/wp-poster@${VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "v${VERSION} は既に registry に存在。skip します。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} は未 publish。publish に進みます。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存インストール
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: 品質ゲート
        if: steps.check.outputs.skip != 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # publish が唯一の真実。タグ付けは履歴用の best-effort とし、失敗してもジョブは落とさない。
      # （タグが付かなくても registry ベースの冪等判定により再 publish で詰まらない）
      - name: タグ作成・push（publish 成功後・best-effort）
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$(git ls-remote --tags "$REMOTE" "refs/tags/v${VERSION}")" ]; then
            echo "タグ v${VERSION} は既に存在。skip。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push "$REMOTE" "v${VERSION}"
